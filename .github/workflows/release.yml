name: "发布 Release（自动打包并上传安装包）"

on:
  push:
    tags:
      - "v*" # 例如 v3.1.0
  workflow_dispatch: # 也允许手动触发

# 全局权限：tauri-action 需要写入 contents 以创建/更新 GitHub Release
permissions:
  contents: write
  actions: read
  checks: read

jobs:
  build-and-publish:
    runs-on: windows-latest # msi / nsis 需在 Windows 上构建
    permissions:
      contents: write # 需要向 GitHub Release 上传产物
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Rust 工具链（Tauri 依赖）
      - uses: dtolnay/rust-toolchain@stable

      # Node 与缓存
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Rust 增量编译缓存（显著加速重复构建）
      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 安装前端依赖
      # 使用 npm install（非严格 ci），并限定 win32/x64 平台，
      # 避免 npm ci 对 esbuild 平台 optional 包报 EUSAGE/EBADPLATFORM
      - name: 安装依赖
        run: npm install --os=win32 --cpu=x64

      # 构建 + 发布到 GitHub Release（生成 msi / nsis）
      # 从 CHANGELOG.md 提取当前版本整段更新说明（含 新增/变更/修复 全部小节）作为 Release 描述。
      - name: 生成发布说明
        id: release_body
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $headerRe = '^##\s+' + [regex]::Escape("[$ver]")
          $bodyLines = @()
          $started = $false
          foreach ($line in $lines) {
            if (-not $started) {
              if ($line -match $headerRe) { $started = $true; $bodyLines += $line }
              continue
            }
            # 遇到下一个版本标题或分隔线即结束
            if ($line -match '^##\s' -or $line -match '^-{3,}\s*$') { break }
            $bodyLines += $line
          }
          if ($bodyLines.Count -gt 0) {
            $body = ($bodyLines -join [Environment]::NewLine).Trim()
          }
          else {
            $body = @"
## 一闲笔记 v$ver

### 新增
- 版本历史：多版本持久化（SQLite 优先、Web 回退 localStorage）、里程碑快照、保留策略、差异字数、删除/清空。

### 修复
- 修复加密笔记在版本历史中字数统计错误。
- 修复加密笔记内容往返丢失（重载后不再丢失密文）。
- 修复加密笔记解密后编辑器回填与二次重加密。

### 变更
- 笔记独立加密改为与便签一致的交互：设置口令加密 → 锁屏输入口令查看 → 本会话解密可编辑 → 保存用同一口令重加密写回密文。
"@
          }
          $body += "`n`n点击下方 Assets 下载对应平台的安装包（Windows 为 .msi / .exe）。"
          # 写入 GITHUB_ENV（多行需用分隔符块）
          "RELEASE_BODY<<__RELEASE__EOF__" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "__RELEASE__EOF__" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 打包并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}            # 使用触发本次的 tag
          releaseName: "一闲笔记 ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          args: --bundles nsis msi        # 显式生成 NSIS 与 MSI 安装包
          releaseDraft: false
          prerelease: false